<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#071326">
  <title>Papillon Hotels | Menü</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero" aria-label="Papillon Hotels">
      <div class="hero-bg"></div>
      <div class="hero-shade"></div>

      <div class="brand">
        <img src="logo.jpg" alt="Papillon Hotels" class="logo">
      </div>

      <div class="intro">
        <span>WINE &amp; DINE EXPERIENCE</span>
        <h1>DISCOVER YOUR TASTE</h1>
        <p>Lezzetinize uygun seçiminizi keşfedin.</p>
      </div>
    </section>

    <section class="menus" aria-label="Dil seçenekleri">
      <a class="menu-button" href="pdf/sarap-menusu-tr.pdf" target="_blank" rel="noopener">
        <span class="flag">🇹🇷</span>
        <span class="label">Şarap menüsünü görmek için tıklayınız.</span>
        <span class="arrow">›</span>
      </a>

      <a class="menu-button" href="pdf/sarap-menusu-en.pdf" target="_blank" rel="noopener">
        <span class="flag">🇬🇧</span>
        <span class="label">Click here to view the wine menu.</span>
        <span class="arrow">›</span>
      </a>

      <a class="menu-button" href="pdf/sarap-menusu-ru.pdf" target="_blank" rel="noopener">
        <span class="flag">🇷🇺</span>
        <span class="label">Нажмите здесь, чтобы посмотреть винное меню.</span>
        <span class="arrow">›</span>
      </a>

      <a class="menu-button" href="pdf/sarap-menusu-de.pdf" target="_blank" rel="noopener">
        <span class="flag">🇩🇪</span>
        <span class="label">Klicken Sie hier, um die Weinkarte zu sehen.</span>
        <span class="arrow">›</span>
      </a>
    </section>

    <footer>
      <div class="ornament"><span></span><b>✦</b><span></span></div>
      <div>PAPILLON HOTELS</div>
    </footer>
  </main>
</body>
</html>
